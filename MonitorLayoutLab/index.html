(()=>{'use strict';const $=id=>document.getElementById(id);const PRE=[{w:1920,h:1080,inch:14},{w:1920,h:1080,inch:23},{w:2560,h:1440,inch:27},{w:3840,h:2160,inch:32},{w:3440,h:1440,inch:34},{w:5120,h:2160,inch:40},{w:3840,h:2160,inch:43},{w:3840,h:2160,inch:55}];const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const key='monitor-layout-lab-v3';let activeDesk=false,deskWidth=120,viewDistance=70,referenceHeight=50,language='ja',deskPinned=false;const DESK_X=500,DESK_Y=770;const AREA={w:Math.round(500*25.4*16/Math.hypot(16,9)),h:Math.round(500*25.4*9/Math.hypot(16,9))};const DESK_BOTTOM=DESK_Y+AREA.h/2;AREA.x=DESK_X-AREA.w/2;AREA.y=DESK_BOTTOM-30-referenceHeight*10-AREA.h/2;let monitors=[],selected=0,mode='info',theme='dark',zoom=.54,offset={x:100,y:90},drag=null;const touches=new Map();let pinch=null;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const finiteOr=(v,fallback)=>{const n=Number(v);return Number.isFinite(n)?n:fallback};function make(n,p,x,y){return{id:n,w:p.w,h:p.h,inch:p.inch,scale:100,rot:false,bezel:true,bezelColor:'black',hidden:false,stack:n+1,x,y}}function defaults(){const a=make(0,PRE[1],0,0),b=make(1,PRE[1],0,0);b.rot=true;deskWidth=120;viewDistance=70;referenceHeight=50;const da=dims(a),db=dims(b),eyeY=DESK_BOTTOM-30-referenceHeight*10,depth=viewDistance*10;a.x=DESK_X-depth*Math.tan(32*Math.PI/180);a.y=eyeY+107;b.x=DESK_X+depth*Math.tan(30*Math.PI/180)-db.mmw;b.y=eyeY-57.5;monitors=[a,b];selected=0;activeDesk=true;deskPinned=false;language='ja';mode='info';theme='dark';zoom=.54;offset={x:140,y:100}}function load(){try{let d=JSON.parse(localStorage.getItem(key));if(!d||!Array.isArray(d.monitors)||!d.monitors.length||d.monitors.length>26)throw 0;monitors=d.monitors.filter(m=>Number.isInteger(m.w)&&Number.isInteger(m.h)&&Number.isFinite(m.inch)&&m.inch>=4&&m.inch<=200&&m.w>=320&&m.w<=16384&&m.h>=240&&m.h<=16384&&Number.isFinite(m.x)&&Number.isFinite(m.y)).slice(0,26);if(!monitors.length)throw 0;monitors.forEach((m,i)=>{m.id=i;m.scale=clamp(Number(m.scale)||100,50,500);m.rot=!!m.rot;m.hidden=!!m.hidden;if(typeof m.bezel!=='boolean')m.bezel=true;if(!['black','white'].includes(m.bezelColor))m.bezelColor='black';if(!Number.isSafeInteger(m.stack)||m.stack<1)m.stack=i+1});selected=clamp(Math.trunc(Number(d.selected)||0),0,monitors.length-1);activeDesk=!!d.activeDesk;deskPinned=d.deskPinned===true;deskWidth=clamp(Number(d.deskWidth)||120,40,500);viewDistance=clamp(Number(d.viewDistance)||70,10,500);referenceHeight=clamp(finiteOr(d.referenceHeight??50,50),0,500);language=d.language==='en'?'en':'ja';mode=['info','desktop','browser','youtube'].includes(d.mode)?d.mode:'info';theme=d.theme==='light'?'light':'dark';zoom=clamp(finiteOr(d.zoom,.54)||.54,.08,3);offset=d.offset&&Number.isFinite(d.offset.x)&&Number.isFinite(d.offset.y)?d.offset:{x:120,y:90}}catch(e){defaults()}}function save(){try{localStorage.setItem(key,JSON.stringify({monitors,selected,activeDesk,deskPinned,deskWidth,viewDistance,referenceHeight,language,mode,theme,zoom,offset}))}catch(e){}}function dims(m){let w=m.w,h=m.h;if(m.rot)[w,h]=[h,w];const diagonal=Math.hypot(m.w,m.h);return{mmw:m.inch*25.4*w/diagonal,mmh:m.inch*25.4*h/diagonal,ppi:Math.floor(diagonal/m.inch),lppi:Math.floor((diagonal/m.inch)*100/m.scale),w,h,lw:Math.round(w*100/m.scale),lh:Math.round(h*100/m.scale),ratio:simpleRatio(w,h)}}function gcd(a,b){return b?gcd(b,a%b):a}function simpleRatio(w,h){let g=gcd(w,h);let a=w/g,b=h/g;return(a<=32&&b<=32)?`${a}:${b}`:(w/h).toFixed(2)+':1'}function screenMarkup(m){const d=dims(m),p=language==='ja';return `<div class="info" style="--monitor-hue:${(212+(m.id||0)*53)%360};--hue-shift:${(m.id||0)*53}deg"><div class="wallpaper-art"></div><div class="info-content"><div class="ratio">${d.ratio} ${m.inch}″</div><div class="resolution"><span>${p?'モニタ解像度':'Monitor resolution'}</span>${d.w}×${d.h}</div><div class="ppi"><span>PPI</span>${d.ppi} PPI</div><div class="logical"><span>${p?'論理解像度':'Logical resolution'} · ${m.scale}%</span>${d.lw}×${d.lh}</div><div class="logical-ppi"><span>${p?'論理PPI':'Logical PPI'}</span>${d.lppi} PPI</div></div></div>`}
function applyTransform(){zoom=Math.max(zoom,minZoom()); $('world').style.transform=`translate(${offset.x}px,${offset.y}px) scale(${zoom})`;$('world').style.setProperty('--inverse-zoom',String(1/zoom));$('zoomValue').textContent=Math.round(zoom*100)+'%'}const I18N={'実寸で配置して、表示領域を比較する':'Arrange monitors at true relative size','ライトモード':'Light mode','ダークモード':'Dark mode','初期配置に戻す':'Reset layout','モニター配置':'Monitor layout','全体表示':'Fit all','モニター設定':'Monitor settings','選択したモニターを削除':'Remove selected monitor','デスク幅（cm）':'Desk width (cm)','デスクタブを固定':'Keep Desk tab open','デスク':'Desk','モニターを追加':'Add monitor','基準点から視点までの距離（cm）':'Distance from reference point to eye (cm)','視点・基準点の高さ（机上面から・cm）':'Eye and reference-point height above desk (cm)','ベゼル':'Bezel','有効（各辺1cm）':'Enabled (1 cm per side)','黒':'Black','白':'White','クイックプリセット':'Quick preset','解像度（横）':'Resolution width','解像度（縦）':'Resolution height','インチ数':'Screen size','表示倍率':'Display scaling','向き':'Orientation','横置き':'Landscape','縦置き':'Portrait','実解像度':'Physical resolution','論理解像度':'Logical resolution','表示面の実寸':'Physical screen size','実画素密度':'Physical PPI','論理画素密度':'Logical PPI*','縦横比':'Aspect ratio','全モニターの幅':'Combined width','全モニターの高さ':'Combined height','水平視野角':'Horizontal FOV','垂直視野角':'Vertical FOV','サイズを選択':'Select size','画面サイズ (インチ)':'Screen size (inches)','解像度 (px)':'Resolution (px)','Windows表示倍率':'Display scaling','変更済み設定':'Modified settings','自由入力':'Manual entry','カスタム解像度':'Custom resolution','画面をドラッグして移動 / 余白ドラッグで視点移動 / ホイールで拡大縮小':'Drag monitors to move / Drag empty area to pan / Scroll to zoom','論理PPI（同サイズ換算）':'Logical PPI (at the same size)','論理':'Logical'};const origText=new WeakMap();function translateUI(){document.documentElement.lang=language==='ja'?'ja':'en';$('langJa').classList.toggle('active',language==='ja');$('langEn').classList.toggle('active',language==='en');const walk=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode()){if(n.parentElement?.closest('script,style'))continue;if(!origText.has(n))origText.set(n,n.nodeValue);const original=origText.get(n);if(language==='ja'){n.nodeValue=original;continue}let val=original;for(const [jp,en] of Object.entries(I18N))val=val.replaceAll(jp,en);val=val.replace(/(\d+)インチ/g,'$1 in').replace('インチ','in');n.nodeValue=val}}$('langJa').onclick=()=>{language='ja';draw()};$('langEn').onclick=()=>{language='en';draw()};function bounds(){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;monitors.filter(m=>!m.hidden).forEach(m=>{const d=dims(m);x0=Math.min(x0,m.x);y0=Math.min(y0,m.y);x1=Math.max(x1,m.x+d.mmw);y1=Math.max(y1,m.y+d.mmh)});if(x0===Infinity){x0=x1=DESK_X;y0=y1=AREA.y+AREA.h/2}return{x0,y0,x1,y1,cx:(x0+x1)/2,width:x1-x0,height:y1-y0}}function fieldOfView(){const b=bounds(),eyeX=DESK_X,eyeY=DESK_BOTTOM-30-referenceHeight*10,depth=viewDistance*10,deg=180/Math.PI;let minYaw=Infinity,maxYaw=-Infinity,minPitch=Infinity,maxPitch=-Infinity;for(const m of monitors){if(m.hidden)continue;const d=dims(m);const nearX=clamp(eyeX,m.x,m.x+d.mmw);for(const x of [m.x,m.x+d.mmw,nearX])for(const y of [m.y,m.y+d.mmh]){const dx=x-eyeX,dy=eyeY-y;const yaw=Math.atan2(dx,depth),pitch=Math.atan2(dy,Math.hypot(dx,depth));minYaw=Math.min(minYaw,yaw);maxYaw=Math.max(maxYaw,yaw);minPitch=Math.min(minPitch,pitch);maxPitch=Math.max(maxPitch,pitch)}}if(minYaw===Infinity)return{b,left:0,right:0,h:0,v:0};const left=Math.max(0,-minYaw)*deg,right=Math.max(0,maxYaw)*deg;return{b,left,right,h:left+right,v:(maxPitch-minPitch)*deg}}function comfortWeight(angle){if(angle<25||angle>40)return 0;if(angle<30)return(angle-25)/5;if(angle<=35)return 1;return(40-angle)/5}
function applyComfortColors(){const enabled=$('comfortCheck').checked;document.querySelectorAll('.comfort-angle').forEach(el=>{const weight=enabled?comfortWeight(Number(el.dataset.angle)):0;if(weight>0){el.style.color=`color-mix(in srgb, var(--comfort-base, var(--ink)) ${((1-weight)*100).toFixed(1)}%, var(--comfort-accent) ${(weight*100).toFixed(1)}%)`}else el.style.removeProperty('color')})}
function deskFovMarkup(f){const ja=language==='ja';return `<span>${ja?'左':'L'} <b class="comfort-angle" data-angle="${f.left}">${f.left.toFixed(1)}°</b></span><span>${ja?'右':'R'} <b class="comfort-angle" data-angle="${f.right}">${f.right.toFixed(1)}°</b></span><span>${ja?'計':'Total'} ${f.h.toFixed(1)}°</span><span>${ja?'縦':'V'} ${f.v.toFixed(1)}°</span>`}
function displayCentroid(){const rectangles=monitors.filter(m=>!m.hidden).map(m=>{const d=dims(m);return{x0:m.x,x1:m.x+d.mmw,y0:m.y,y1:m.y+d.mmh}});if(!rectangles.length)return null;const edges=[...new Set(rectangles.flatMap(r=>[r.x0,r.x1]))].sort((a,b)=>a-b);let area=0,xMoment=0,yMoment=0;for(let i=0;i<edges.length-1;i++){const x0=edges[i],x1=edges[i+1],width=x1-x0;if(width<=0)continue;const intervals=rectangles.filter(r=>r.x0<x1&&r.x1>x0).map(r=>[r.y0,r.y1]).sort((a,b)=>a[0]-b[0]);if(!intervals.length)continue;let [start,end]=intervals[0];const add=(a,b)=>{const height=b-a;area+=width*height;xMoment+=(x1*x1-x0*x0)/2*height;yMoment+=width*(b*b-a*a)/2};for(let j=1;j<intervals.length;j++){const [nextStart,nextEnd]=intervals[j];if(nextStart<=end)end=Math.max(end,nextEnd);else{add(start,end);start=nextStart;end=nextEnd}}add(start,end)}return area>0?{x:xMoment/area,y:yMoment/area,area}:null}

function gazeDirections(g){const ja=language==='ja',h=g.yaw<0?(ja?'左':'Left '):(ja?'右':'Right '),v=g.pitch<0?(ja?'上':'Up '):(ja?'下':'Down ');return{h:`${h}${Math.abs(g.yaw).toFixed(1)}°`,v:`${v}${Math.abs(g.pitch).toFixed(1)}°`}}

function applyGazeColors(){const weight=$('comfortCheck').checked?gazeColorWeight(centerGaze()):0;document.querySelectorAll('.gaze-color').forEach(el=>{if(weight>0)el.style.color=`color-mix(in srgb, var(--comfort-base, var(--ink)) ${((1-weight)*100).toFixed(1)}%, var(--comfort-accent) ${(weight*100).toFixed(1)}%)`;else el.style.removeProperty('color')})}
function gazeOverlayMarkup(g){if(!g.valid)return language==='ja'?'視線角度（表示面の重心） —':'Gaze angle (display centroid) —';const d=gazeDirections(g);return `${language==='ja'?'視線角度（表示面の重心）':'Gaze angle (display centroid)'} <span class="gaze-color">${g.total.toFixed(1)}° <small>${d.h} / ${d.v}</small></span>`}
